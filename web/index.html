<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cf8571" />
    <title>AI-2048</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="title">2048</h1>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">当前的</span>
            <div class="score-roll" id="score-roll">
              <strong class="score-value" id="score">0</strong>
            </div>
          </div>
          <!-- 「所有时间」框：超过历史最高分时 JS 加 .beaten，
               底色变强调色青绿（见 style.css 的 .score-box.beaten）。 -->
          <div class="score-box best" id="best-box">
            <span class="score-label" id="best-label">
              <span class="crown" aria-hidden="true">♛</span>所有时间
            </span>
            <div class="score-roll" id="best-roll">
              <strong class="score-value" id="best">0</strong>
            </div>
          </div>
        </div>
      </header>

      <!--
        控件分两行（用户指定），**第一行不换行**：
          第一行 —— 难度 / AI 强度 / AI 速度 +「规则」按钮
          第二行 —— 重来 / 撤回 / AI操作 / AI下一步 / 音量

        下拉框里**只有选项名**，说明文字全部进规则弹窗（用户要求）。
        图标一律用**线性** SVG（stroke），不用 emoji ——
        emoji 是彩色实物图形，各平台长得不一样，也和整体线条风格不搭。
        SVG 内联在这里：省一次请求，也能用 currentColor 跟随文字色。

        「开局种子」输入框已删除：玩家每次打开都随机，界面不出现任何种子控件。
        需要固定种子复现时走 `window.AI2048.newGame(12345)`（程序接口）。
      -->
      <div class="controls">
        <!-- 线性图标：三层递增方块 = 难度 -->
        <label class="ctl" id="ctl-difficulty">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19h6v-6H4z" />
            <path d="M10 19h6V9h-6z" />
            <path d="M16 19h4V4h-4z" />
          </svg>
          <select id="difficulty" aria-label="难度"></select>
        </label>
        <!-- 线性图标：大脑 = AI 强度 -->
        <label class="ctl" id="ctl-strength">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5.5a3 3 0 0 0-5.6-1.5A2.8 2.8 0 0 0 4 7.6 2.9 2.9 0 0 0 4.6 13 3 3 0 0 0 8 18.5 2.9 2.9 0 0 0 12 18z" />
            <path d="M12 5.5a3 3 0 0 1 5.6-1.5A2.8 2.8 0 0 1 20 7.6 2.9 2.9 0 0 1 19.4 13 3 3 0 0 1 16 18.5 2.9 2.9 0 0 1 12 18z" />
            <path d="M12 5.5V18" />
          </svg>
          <select id="strength" aria-label="AI 强度"></select>
        </label>
        <!-- 线性图标：闪电 = AI 速度 -->
        <label class="ctl" id="ctl-speed">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 3 5.5 13.5H11L10 21l7.5-10.5H12z" />
          </svg>
          <select id="speed" aria-label="AI 速度"></select>
        </label>
        <button id="rules" type="button" class="ghost icon-btn" title="规则说明">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v12a1.5 1.5 0 0 0-1.5-1.5H4z" />
            <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v12a1.5 1.5 0 0 1 1.5-1.5H20z" />
          </svg>
          规则
        </button>
      </div>

      <div class="controls-row2">
        <!-- 线性图标：旋转箭头 = 重来 -->
        <button id="new-game" type="button" class="ghost icon-btn" title="新游戏（R）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v4h-4" />
          </svg>
          重来
        </button>

        <!-- 线性图标：逆时针箭头 = 撤回 -->
        <button id="undo" type="button" class="ghost icon-btn" disabled title="撤销（U）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h11a5 5 0 0 1 0 10H8" />
            <path d="M8 4 4 8l4 4" />
          </svg>
          撤回
        </button>

        <!--
          线性图标：播放三角（实心）/ 暂停双竖线 = 让 AI 连续走。
          ⚠️ 两种状态**都画在 SVG 里**，不要退回"给按钮写 textContent"的老做法：
          按钮的 textContent 是**整个按钮的文本**，一赋值就会把里面的 <svg> 节点
          全部删掉。原来的 `el.aiAuto.textContent = '▶'` 就是这么把这个图标弄没的 ——
          而且 newGame() 里会调 stopAuto()，所以**页面一打开图标就已经没了**，
          表现为"这个按钮的图标永远不跟随配色"。
        -->
        <button id="ai-auto" type="button" class="ghost icon-btn" title="AI 自动演示">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <!-- 播放：实心三角 -->
            <path class="ai-play" d="M8 5.5v13l10-6.5z" />
            <!-- 暂停：两条竖线；默认隐藏，由 button.active 切换 -->
            <path class="ai-pause" d="M9 5.5h3v13H9z" />
            <path class="ai-pause" d="M15 5.5h3v13h-3z" />
          </svg>
          AI操作
        </button>

        <!--
          线性图标：三角 + 竖线 = 单步。
          用「走一步」而不是「快进」语义：这里是让 AI 走一步，不是加速播放。
        -->
        <button id="ai-step" type="button" class="ghost icon-btn" title="AI 走一步（空格）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5.5v13l9-6.5z" />
            <path d="M18 5.5v13" />
          </svg>
          AI下一步
        </button>

        <!-- 线性图标：喇叭 = 音量；静音时由 CSS 切换到斜杠变体 -->
        <button id="mute" type="button" class="ghost icon-btn" aria-pressed="false" title="音效（M）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path class="mute-wave" d="M16 9a4 4 0 0 1 0 6" />
            <path class="mute-slash" d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
          音量
        </button>
      </div>

      <!-- 规则弹窗：内容全部是当前真实规则，细节见 main.js 的 RULES_HTML -->
      <div class="modal" id="rules-modal" role="dialog" aria-modal="true" aria-labelledby="rules-title">
        <div class="modal-panel">
          <h2 id="rules-title">规则</h2>
          <div class="modal-body" id="rules-body"></div>
          <button id="rules-close" type="button">知道了</button>
        </div>
      </div>

      <!--
        难度提示条已删除（用户要求）：非标准难度的分数不可比这件事
        写在规则弹窗里，不在主界面上常驻。
      -->

      <!--
        棋盘左右各一条庆祝轨道。达到里程碑时从两侧放小烟花，
        而不是弹一个遮罩挡住棋盘 —— 遮罩会把 AI 演示打断。
      -->
      <div class="board-row">
        <canvas class="fx" id="fx-left" aria-hidden="true"></canvas>

        <div class="board-wrap" id="board">
          <div class="grid" id="grid"></div>
          <div class="tiles" id="tiles"></div>

          <!-- 只在真正结束时出现；达到 2048 不再弹窗 -->
          <div class="overlay" id="overlay">
            <h2 id="overlay-title">游戏结束</h2>
            <p id="overlay-text"></p>
            <div>
              <button id="overlay-undo" type="button" class="ghost">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 8h11a5 5 0 0 1 0 10H8" />
                  <path d="M8 4 4 8l4 4" />
                </svg>
                撤销一步
              </button>
              <button id="overlay-restart" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 12a8 8 0 1 1-2.34-5.66" />
                  <path d="M20 4v4h-4" />
                </svg>
                再来一局
              </button>
            </div>
          </div>
        </div>

        <canvas class="fx" id="fx-right" aria-hidden="true"></canvas>
      </div>

      <div class="notice hidden" id="notice"></div>

      <!-- 快捷键提示。这一段保留：它属于"操作提示"，不是控件备注。
           规则弹窗里另有一份更完整的说明。 -->
      <!--
        快捷键提示。宽度与控件行、棋盘一致并**居中排**（用户指定）：
        见 style.css 里 .hint 的 max-width / text-align。
        「移动，手机上直接滑动。」已按用户要求删掉 —— WASD 与方向键本身就
        表示移动，这句是多余的说明。
      -->
      <p class="hint">
        <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>　
        <kbd>R</kbd> 重开，<kbd>U</kbd> 撤销，<kbd>M</kbd> 静音，
        <kbd>空格</kbd> 让 AI 走一步。
      </p>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
