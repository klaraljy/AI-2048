# JVM 参数。Gradle 默认堆对 AGP 构建偏小，容易 OOM。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 用 AndroidX（androidx.* 包名）。没有这行 AGP 8 会直接报错。
android.useAndroidX=true

# 本机 Gradle 发行版缓存在 D:\Codex Tools\gradle-home（全局工具目录，见全局 AGENTS.md）。
# 在这里指向它是为了**避免再下载一份 Gradle**（约 130MB）。
# 如果换机器构建失败，删掉这行、改用 gradle wrapper 即可。
org.gradle.java.home=D:\\Codex Tools\\jdk-21
